
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Face Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d4ed8, #7c3aed);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .login-box h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .login-box p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }

        .icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="icon">📸</div>

    <h1>Face Attendance</h1>
    <p>Admin Login</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

 <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Username</label>

    <input
        type="text"
        name="username"
        placeholder="Enter username"
        required
    >

    <label>Password</label>

    <input
        type="password"
        name="password"
        placeholder="Enter password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

</div>

</body>
</html>
