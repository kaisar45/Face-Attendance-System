<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title|default("Error") }}</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f1f5f9;
        }

        .box {

            background: white;

            width: 450px;
            max-width: 90%;

            padding: 40px;

            text-align: center;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.12);
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            color: #dc2626;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        a {

            display: inline-block;

            padding: 12px 20px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="icon">
        ⚠️ BHAG JAO 
    </div>

    <h1>
        {{ title|default("Something went wrong") }}
    </h1>

    <p>
        {{ message|default("An unexpected error occurred.") }}
    </p>

    <a href="/">
        Go to Dashboard
    </a>

</div>

</body>

</html>
